# Perfil Local de Desarrollo
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/biblioteca_db
    username: dev_user
    password: SecureDevPassword123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Documentacion OpenAPI / Swagger-UI: ACTIVA solo en dev
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operationsSorter: method

logging:
  level:
    com.biblioteca: DEBUG
